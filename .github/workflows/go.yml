name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go fmt ./...
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o qqbot.exe ./cmd/qqbot
